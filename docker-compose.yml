services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    platform: linux/amd64
    restart: unless-stopped
    user: root
    ports:
      - "${PORT}:${PORT}"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      PATH: /home/node/.npm-global/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      XDG_CONFIG_HOME: /home/node/.openclaw
      NPM_CONFIG_PREFIX: /home/node/.npm-global
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_PORT: ${PORT}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw
    init: true
    command:
      - sh
      - -c
      - |
        cat > /home/node/.openclaw/openclaw.json << EOF
        {
          "env": {
            "ANTHROPIC_API_KEY": "${ANTHROPIC_API_KEY}"
          },
          "gateway": {
            "mode": "local",
            "auth": {
              "mode": "token",
              "token": "$OPENCLAW_GATEWAY_TOKEN"
            },
            "remote": {
              "token": "$OPENCLAW_GATEWAY_TOKEN"
            },
            "controlUi": {
              "allowInsecureAuth": true,
              "dangerouslyAllowHostHeaderOriginFallback": true,
              "dangerouslyDisableDeviceAuth": true
            }
          }
        }
        EOF
        chmod 700 /home/node/.openclaw
        chmod 600 /home/node/.openclaw/openclaw.json
        chown -R node:node /home/node/.openclaw /home/node/openclaw
        APP_DIR=$$(pwd)
        exec su node -s /bin/sh -c "cd $$APP_DIR && node dist/index.js gateway --bind lan --port $PORT"
volumes:
  openclaw_config:
  openclaw_workspace:
